[package]
name = "ui-dioxus"
version = "0.1.0"
edition = "2021"
publish = false

[features]
default = ["web"]
# One crate, two platforms (ADR-0024). `dx` selects the feature matching
# `--platform`; on Android `dioxus/mobile` is the same webview renderer as
# desktop, which is why the HTML/CSS/JS carries over.
web = ["dioxus/web"]
mobile = ["dioxus/mobile"]

[dependencies]
# Crate and `dx` CLI versions must match and are pinned together (ADR-0024).
dioxus = { version = "=0.7.10", features = ["router", "asset"] }
# The server's own data models, reused verbatim over the JSON API — the whole
# point of a Rust front-end (crates/types is server-dependency-free by design).
trip-archive-types = { path = "../types" }

serde = { version = "1", features = ["derive"] }
# The archive's refusals arrive as JSON like everything else it says
# (ADR-0008), and are unwrapped into the sentence a screen shows.
serde_json = "1"
# Works on both targets: `fetch` under wasm, a native client on Android —
# the reason the two platforms can share one API client (ADR-0024).
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# TLS is a native-only concern; the browser provides its own.
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "multipart",
    "rustls-tls",
] }

[dev-dependencies]
# ADR-0012 (2026-08-26a): components and whole screens render to HTML on the
# host target — no browser, no wasm toolchain, no device.
dioxus-ssr = "0.7"
dioxus-core = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time"] }
tempfile = "3"
axum = "0.7"
# US-19: the harness mints a session token for the gated test server, the
# way the Android app will have to (there is no cookie store off the web).
time = "0.3"
# The real server for whole-screen tests: the database and the blob store
# are real, and `test-support` exposes the one seam ADR-0012 does mock — the
# `KomootClient` double the sync screen's tests drive (US-44).
trip-archive = { path = "../..", features = ["test-support"] }
