[package]
name = "ui-dioxus"
version = "0.1.0"
edition = "2021"
publish = false

[features]
default = ["web"]
# One crate, two platforms (docs/dioxus-spike.md). `dx` selects the feature
# matching `--platform`; on Android `dioxus/mobile` is the same webview
# renderer as desktop, which is why the HTML/CSS/JS interop carries over.
web = ["dioxus/web"]
mobile = ["dioxus/mobile"]

[dependencies]
dioxus = { version = "0.7", features = ["router", "asset"] }
# The server's own data models, reused verbatim over the JSON API — the whole
# point of a Rust front-end (crates/types is dependency-free by design).
trip-archive-types = { path = "../types" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Works on both targets: `fetch` under wasm, a native client on Android.
# `gloo-net` (wasm-only) was the first casualty of going multi-platform.
reqwest = { version = "0.12", default-features = false, features = ["json"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# TLS is a native-only concern; the browser provides its own.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[dev-dependencies]
# Feasibility probe: render components to HTML on the host target, no browser.
dioxus-ssr = "0.7"
dioxus-core = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time"] }
tempfile = "3"
axum = "0.7"
trip-archive = { path = "../.." }
