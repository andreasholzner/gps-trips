[application]
name = "ui-dioxus"

[web.app]
title = "Trip Archive"
# Matches where the built bundle is mounted on the Axum server (`/app`), so the
# dev server and the deployed SPA resolve assets and routes identically.
base_path = "app"

# The dev server (`dx serve`) proxies to the real server (`cargo run`,
# 127.0.0.1:3000) rather than a mock: `/api` for JSON, `/media` for photo
# blobs (ADR-0012: nothing is mocked, the API contract is what's under test).
[[web.proxy]]
backend = "http://127.0.0.1:3000/api"

[[web.proxy]]
backend = "http://127.0.0.1:3000/media"

# ── Android (ADR-0024; US-16 ships the actual app) ───────────────────────────
[bundle]
identifier = "org.triparchive.app"
publisher = "Trip Archive"

[android.application]
# Android has blocked cleartext by default since API 28. The Rust side opens
# its own sockets and is unaffected, but the webview is not.
#
# Since US-19 this no longer buys a working LAN setup on its own: the session
# cookie is `Secure`, and a browser keeps such a cookie only from a secure
# origin — HTTPS, or the loopback exception. Over plain HTTP to another
# machine the login succeeds and the cookie is silently dropped, so the next
# request is a 401 and the login screen returns. The deployed instance is
# HTTPS (ADR-0023, US-49), which is the configuration US-16 is built against;
# a plain-HTTP LAN instance would need US-16 to carry the token itself.
uses_cleartext_traffic = true
