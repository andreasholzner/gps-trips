[package]
name = "trip-archive-types"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
# Optional so the same types compile to wasm for the UI crates, where sqlx
# (and its SQLite driver) has no business being. The server enables it to get
# the `sqlx::Type` mappings its queries rely on.
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio"], optional = true }

[features]
sqlx = ["dep:sqlx"]
