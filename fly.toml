# The deployed archive on Fly.io (ADR-0023; US-45 to US-49).
#
# No `app = …` here: the repository is public and the app name is the
# hostname, which is kept unguessable. `scripts/deploy.sh` passes it from
# `FLY_APP` instead — see docs/deployment.md.

primary_region = "arn"

# How the machine is stopped (US-47): SIGTERM rather than the platform's SIGINT
# default (the server handles both), then up to 30 s for the requests in flight
# to finish and the database to close before it is killed. Auto-stop only acts
# on an idle machine, so this wait matters on deploys and host maintenance —
# enough for a large photo upload, not so long that a hung request stalls a
# deployment.
kill_signal = "SIGTERM"
kill_timeout = "30s"

[build]
  dockerfile = "Dockerfile"

# One machine on one volume (see docs/deployment.md): `rolling` stops the old
# machine, starts the new one and waits for the TCP check. `immediate` would skip
# that check; `canary` and `bluegreen` need a second machine, which cannot share
# the volume. No `release_command` either: it runs without the volume mounted, so
# migrations stay on boot. High availability has no key here; it is off via
# `--ha=false` in scripts/deploy.sh.
[deploy]
  strategy = "rolling"

# The SQLite database and the photo blobs (US-46; ADR-0002, ADR-0007).
# Grows by itself as it fills, up to 5 GB, the limit confirmed after the first
# fill (US-50). Daily snapshots, plus one before every deploy
# (scripts/deploy.sh), are kept two weeks: longer than the gap between two borg
# runs of the backup (US-40).
[mounts]
  source = "data"
  destination = "/data"
  snapshot_retention = 14
  initial_size = "1gb"
  auto_extend_size_threshold = 95
  auto_extend_size_increment = "1gb"
  auto_extend_size_limit = "5gb"

# `[[services]]` rather than `[http_service]` for the TCP check: the server
# binds only after the password check and the migrations, so an open port
# means a finished boot, and `fly deploy` fails a release that never gets there.
[[services]]
  protocol = "tcp"
  internal_port = 3000
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  # Plain HTTP only ever answers with a redirect to HTTPS (US-49).
  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [[services.tcp_checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
