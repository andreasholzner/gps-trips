# The server crate; `crates/types` holds the shared, wasm-safe data models
# and `crates/ui-dioxus` the Dioxus SPA (ADR-0024, US-41).
[workspace]
members = ["crates/types", "crates/ui-dioxus"]

[package]
name = "trip-archive"
version = "0.1.0"
edition = "2021"

[dependencies]
# The shared data models, with their SQLite mappings switched on — only the
# server enables the `sqlx` feature (ADR-0024).
trip-archive-types = { path = "crates/types", features = ["sqlx"] }

# Web server
axum  = { version = "0.7", features = ["multipart"] }
tokio = { version = "1",   features = ["rt-multi-thread", "macros", "net"] }
# Serving the vendored, self-hosted map/chart assets under public/ (ADR-0005/0006)
tower-http = { version = "0.5", features = ["fs"] }

# Persistence — SQLite via sqlx (ADR-0002); timestamps stored as RFC-3339 TEXT
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio", "migrate"] }

# Domain: GPX parsing, geodesic stats, time
gpx  = "0.10"
geo  = "0.28"
time = { version = "0.3", features = ["formatting", "macros", "parsing"] }
# EXIF GPS extraction (US-3, ADR-0017)
kamadak-exif = "0.6"
# Timezone lookup for photo-timestamp interpolation (US-4, ADR-0019)
tzf-rs = { version = "1.3", default-features = false, features = ["bundled"] }
time-tz = "2"
# Thumbnail generation (US-5, ADR-0020); feature set trimmed to the 4 formats
# content_type_from_path already accepts as photo uploads
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }

# Serialization (track GeoJSON blob + JSON models)
serde      = { version = "1", features = ["derive"] }
serde_json = "1"

# Komoot sync (ADR-0021); blocking client — see BlobStore's spawn_blocking convention.
# rustls-tls avoids a system OpenSSL dependency, keeping the single-binary story (US-10) intact.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }

# QMapShack export (US-36, ADR-0022): owner folder-mapping config, the zlib
# stream inside Qt's qCompress framing, and QMapShack's MD5-based items.hash.
toml   = "0.8"
flate2 = "1"
md-5   = "0.10"

# Errors & logging
anyhow             = "1"
thiserror          = "2"
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[features]
# Exposes src/server/location.rs's TIFF/EXIF byte-fixture builder (normally
# #[cfg(test)]-only, so invisible outside this crate) to tests/ integration
# tests via the self-dependency below — a single source of truth for the
# fixture format instead of a hand-maintained duplicate under tests/.
test-support = []

[dev-dependencies]
tempfile = "3"
tower    = { version = "0.4", features = ["util"] } # ServiceExt::oneshot in tests
trip-archive = { path = ".", features = ["test-support"] }
