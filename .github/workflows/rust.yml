# The default test loop (ADR-0012): everything that runs under `cargo test`,
# on the host target — the server, the shared types crate, and the SPA's pure
# logic, component renders and whole-screen tests. The browser layer is a
# separate workflow because it needs a built bundle and a browser.
name: Rust

on:
  push:
    branches: [master]
  pull_request:

# A newer push supersedes an in-flight run of the same branch.
concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The runner image ships a current stable toolchain; this only adds the
      # wasm target, which the SPA and the shared crate are checked against
      # below. clippy and rustfmt are already present.
      - name: Prepare the toolchain
        run: |
          rustup target add wasm32-unknown-unknown
          rustc --version
          cargo --version

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

      # ADR-0024's load-bearing property: the shared models and the UI must
      # compile for the browser, without the server's dependencies. A `sqlx`
      # derive escaping the optional feature breaks this and nothing else.
      - name: The shared crate and the SPA compile for wasm
        run: |
          cargo check -p trip-archive-types --target wasm32-unknown-unknown
          cargo check -p ui-dioxus --target wasm32-unknown-unknown
